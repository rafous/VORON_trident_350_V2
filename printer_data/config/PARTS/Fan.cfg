[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PA1

[controller_fan stepper]
pin :PE6
max_power :1.0
fan_speed :1.0
shutdown_speed :1.0
stepper :stepper_x, stepper_y

[controller_fan stepper_Z]
pin :PE0
max_power :1.0
fan_speed :0.80
shutdown_speed :1.0
stepper :stepper_z

[temperature_fan CB1]
pin :PE3
kick_start_time :0.8
off_below :0.1
max_power :1.0
sensor_type :temperature_host
control :pid
min_temp : -40
max_temp : 85
pid_kp : 1.0
pid_ki : 0.5
pid_kd : 2.0
min_speed: 0.0
max_speed: 0.6
target_temp: 60

[temperature_fan ventilateur_pi5]
pin: host:gpio14            # Gère la vitesse via le port PWM natif du Pi 5
sensor_type: temperature_host # Lit la température interne du processeur du Pi 5
control: pid
min_temp: 0
max_temp: 85
target_temp: 50             # Température cible (le ventilateur va réguler pour maintenir 50°C)
pid_kp: 1.0
pid_ki: 0.5
pid_kd: 2.0
min_speed: 0.1              # Vitesse minimale (10%) pour garder un filet d'air
max_speed: 1.0              # Vitesse maximale (100%) en cas de gros coup de chaud

